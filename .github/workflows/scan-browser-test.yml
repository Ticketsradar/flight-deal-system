# Stream A — 瀏覽器後備封鎖測試(一次性 rollout 量度,唔設 cron)
# ============================================================
# 背景:scan.yml(純 HTTP, --no-browser)喺 GitHub 共用 Azure IP 上面
# 畀 Google 軟封鎖(空殼頁),6 片有 5 片爆,只收到 5 條航線。
#
# 呢個測試要答一條問題:
#   開咗 Playwright 真瀏覽器後備(行 JavaScript)之後,
#   能唔能夠繞過「空殼頁」軟封鎖,攞返真價?
#
# 點睇結果:
#   • log 見到價錢帶 🌐 = 瀏覽器後備成功繞過封鎖 ✅(雲端方案有得救)
#   • log 全係 browser_stuck / browser_oops / browser_fail = 瀏覽器都畀封 ⛔
#     (代表封鎖係 IP 層,要轉本機 / 住宅 proxy)
#
# 同 scan.yml 嘅分別:
#   • 冇 --no-browser(即係開咗第二層真瀏覽器後備)
#   • 加 "playwright install chromium" step(GitHub runner 預設冇 browser binary)
#   • 慳 quota:得 2 片、每片 budget 120、timeout 放寬到 120 分鐘(瀏覽器慢 ~5 倍)
#
# 一次性手動 dispatch。測完有結論就刪呢個檔。

name: Stream A — 瀏覽器後備封鎖測試

on:
  workflow_dispatch: {}  # 淨係手動觸發,冇 cron

concurrency:
  group: scan-browser-test
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # 瀏覽器後備慢,放寬;budget 120 會喺到期前停
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        k: [0, 1]  # 得 2 片慳 quota;足夠對沖「IP 運氣」+ 試到封鎖

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: 裝依賴
        run: uv sync

      # GitHub runner 預設冇 chromium binary,要喺度裝(+ 系統庫)
      - name: 裝 Playwright chromium(+系統庫)
        run: uv run playwright install --with-deps chromium

      - name: 掃描分片 ${{ matrix.k }}/6(瀏覽器後備 ON,budget 120)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
        run: |
          uv run python scanner.py \
            --slice ${{ matrix.k }}/6 \
            --grid \
            --grid-step 3 \
            --no-refine \
            --stale-first \
            --budget 120 \
            --resume

      # DAILY-03 容錯:就算掃描失敗都 upload 已完成部分(順便量度瀏覽器後備嘅實際收穫)
      - name: 上傳已完成部分(即使掃描失敗)
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: uv run python upload.py
