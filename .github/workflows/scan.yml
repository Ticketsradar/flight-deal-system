# Stream A — 平機票每日增量掃描(browser 後備 ON,public repo 免費無限分鐘)
# ============================================================
# 每日揀最舊(scanned_at 最耐)嗰批 route 優先掃,每 shard 封頂 400 queries。
# 8 shard 並行,~27 條 route/日 → 全部 171 條約 6 日轉一圈;週日有 full sweep 做安全網。
#
# 雙層抓價:HTTP fast-flights(快)→ 撞到 Google 空殼頁軟封鎖就自動轉
#   Playwright 真瀏覽器(行 JS,繞到封鎖;log 標 🌐)。03-04 量度證實雲端
#   純 HTTP 會畀封(5/6 shard 紅),開咗 browser 後備就綠色可靠。
#
# refine ON(--offset 2 / --refine-days 10):維持「彈性行程日數」(FLEX-01/02)。
# DAILY-03 容錯:scanner 同 upload 拆兩 step,upload 用 if: always(),
#   就算 scan 超時/失敗,已寫低嘅 data/scan_*.json 都照出街。
#
# 詳見 .planning/research/DAILY-UPDATES.md + .planning/phases/03-*。

name: Stream A — 平機票每日增量掃描

on:
  schedule:
    - cron: "0 18 * * *"  # 每日 18:00 UTC = 02:00 香港時間(低峰時段)
  workflow_dispatch: {}   # 亦可喺 Actions 頁手動觸發

# 防止 cron delay 導致兩個 run 同時跑(cancel-in-progress:false = 讓舊嘅跑完)
concurrency:
  group: scan-daily
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350  # 最壞情況(全部走 browser)400×50s≈333 分鐘,穩落 6 鐘 wall 內
    strategy:
      fail-fast: false  # 一片爆唔好拖死其他片
      max-parallel: 8
      matrix:
        k: [0, 1, 2, 3, 4, 5, 6, 7]  # 8 shards;改數量記得連 --slice 分母一齊改

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: 裝依賴
        run: uv sync

      # GitHub runner 預設冇 chromium binary;browser 後備要用,喺度裝(+系統庫)
      - name: 裝 Playwright chromium(+系統庫)
        run: uv run playwright install --with-deps chromium

      - name: 掃描分片 ${{ matrix.k }}/8(增量,粗格 step3,refine ON,browser 後備)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
        run: |
          uv run python scanner.py \
            --slice ${{ matrix.k }}/8 \
            --grid \
            --grid-step 3 \
            --stale-first \
            --budget 400

      # DAILY-03:scan 超時/失敗都要跑 upload,確保部分結果出街
      - name: 上傳已完成部分(即使掃描失敗)
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: uv run python upload.py
