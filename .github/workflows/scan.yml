# Stream A — 平機票每日增量掃描
# ============================================================
# 每日增量:6 個 shard 並行,每 shard 最多 400 queries(~72 分鐘),
# --stale-first 令最舊嘅路線優先被刷新;--grid-step 3 令每月只取 ~11 日代表點
# (而唔係全月 31 日),控制每日總 query 量遠低於 6 小時 GitHub wall。
#
# DAILY-03 修復:scanner 同 upload 係兩個獨立 step;upload 用 if: always()
# 確保就算 scanner 超時/失敗,已掃完嘅 data/scan_*.json 仍可上傳到 Supabase。
#
# 詳見 .planning/research/DAILY-UPDATES.md section 5b 以及 6h-wall 說明。
# ⚠️ 注意:GitHub runner IP 係共用 Azure pool,Google 有可能 rate-limit。
#    cron 需要喺 03-04 量度真實封鎖率後先開。

name: Stream A — 平機票每日增量掃描

on:
  # schedule:
  #   - cron: "0 18 * * *"  # 每日 18:00 UTC = 02:00 香港時間
  #   # ⛔ cron 暫時 comment 咗!要量度完 Google block rate(03-04 rollout checkpoint)先 uncomment。
  workflow_dispatch: {}  # 可喺 GitHub Actions 頁面手動撳 Run

# 防止 cron delay 導致兩個 run 同時跑(cancel-in-progress:false = 讓舊嘅跑完)
concurrency:
  group: scan-daily
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90  # 6 shards x ~400 queries x ~10s ≈ 67 分鐘;留緩衝
    strategy:
      fail-fast: false  # 一片爆唔好拖死其他片
      max-parallel: 6
      matrix:
        k: [0, 1, 2, 3, 4, 5]  # 6 shards;改數量記得連 --slice 分母一齊改

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: 裝依賴
        run: uv sync

      - name: 掃描分片 ${{ matrix.k }}/6(增量,粗格,stale-first)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
        run: |
          uv run python scanner.py \
            --slice ${{ matrix.k }}/6 \
            --grid \
            --grid-step 3 \
            --no-refine \
            --stale-first \
            --budget 400 \
            --no-browser

      # DAILY-03:scan 超時/失敗都要跑 upload,確保部分結果出街
      - name: 上傳已完成部分(即使掃描失敗)
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: uv run python upload.py
