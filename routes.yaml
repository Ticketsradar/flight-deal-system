# routes.yaml — 引擎A 掃描航線清單
# ============================================
# 目的地清單抽自參考網站 flight-deals-web.vercel.app 嘅 data.json
#(佢更新日期:2026-06-11,共 57 個目的地;stay_nights 照搬佢每條線嘅典型行程日數)
# 加減目的地:照格式加/刪一行就得。scanner 會掃 origins × destinations 全部組合。
# 唔想掃某條組合:喺最底 exclude 加一行,例:- SZX-JFK

defaults:
  samples_per_month: 2      # 每月抽幾多個出發日做樣本(1–4;愈多愈準但 query 愈多)
  delay_seconds: [2, 5]     # 每個 query 之間隨機等幾耐(秒)— 鐵律:咪轟炸 Google(D-OPT-04:由 [3,8] 收細)
  currency: HKD

origins:
  - {code: HKG, name: 香港}
  - {code: SZX, name: 深圳}
  - {code: CAN, name: 廣州}

