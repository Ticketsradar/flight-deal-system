# sources.yaml — Scout 收料來源設定
# =====================================
# Scout script(Phase 1B)會讀呢個檔。加減來源改呢度,唔使改 code。
# 規則:只填 verify 過嘅 handle;未確認嘅留喺註解,搵到正確 username 先解開。

# ── Telegram:取消咗(2026-06-13,user 實測相關 group 唔多)─────────────────
# 成段留註解唔刪 — 第時想做返,將下面每行開頭嘅「# 」刪走就用得返(連 .env 嘅 TELEGRAM 變數)。
